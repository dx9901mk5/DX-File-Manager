name: Build & Release DX File Manager APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode Fixed Keystore (if configured in Secrets)
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEY_BASE64" ]; then
            printf '%s' "$SIGNING_KEY_BASE64" | tr -d '[:space:]' | base64 -d > app/release.keystore
          else
            keytool -genkey -v -keystore app/release.keystore -alias dx_key -keyalg RSA -keysize 2048 -validity 10000 -storepass dx9901mk5 -keypass dx9901mk5 -dname "CN=dx9901mk5, OU=Dev, O=DX, L=Kaohsiung, S=TW, C=TW"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Signed Release & Debug APK
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD || 'dx9901mk5' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'dx_key' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'dx9901mk5' }}
        run: gradle assembleRelease assembleDebug

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DX-FileManager-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DX-FileManager-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release (on v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
